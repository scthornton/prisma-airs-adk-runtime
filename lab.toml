id      = "adk-runtime"
title   = "ADK in-process AIRS callbacks (2-minute agent proof)"
intent  = ["a2a", "runtime", "mcp"]
surface = "mac"
proves  = "In-process coverage a gateway cannot give you: AIRS scans the prompt, the response, the tool call BEFORE it executes, and the tool result. verify.py uses a fake model, so no LLM key is needed."

[run]
# Source the lab's own .env rather than depending on ambient shell state:
# AIRS_PROFILE_NAME is a deliberate on/off toggle in ~/.zshrc for the Claude
# Code hooks, so a lab must not assume any AIRS var is exported.
launch = "set -a && . ./.env && set +a && .venv/bin/python verify.py"
oneshot = true   # runs to completion and exits; there is nothing to tear down
ports  = []

[requires]
files = [".env", ".venv/bin/python"]   # venv is the lab's own; uv venv .venv && uv pip install -r requirements.txt
bin   = ["python3"]

[demo]
runbook = "README.md"
beats = [
  "tool call is scanned before execution, not after",
  "pair with adk-litellm to frame the gateway vs in-process choice",
]
