id      = "adk-runtime"
title   = "ADK in-process AIRS callbacks (2-minute agent proof)"
intent  = ["a2a", "runtime", "mcp"]
surface = "mac"
proves  = "In-process coverage a gateway cannot give you: AIRS scans the prompt, the response, the tool call BEFORE it executes, and the tool result. verify.py uses a fake model, so no LLM key is needed."

[run]
launch = "python verify.py"
ports  = []

[requires]
env   = ["AIRS_API_KEY", "AIRS_API_PROFILE_NAME"]
files = ["requirements.txt"]
bin   = ["python3"]

[demo]
runbook = "README.md"
beats = [
  "tool call is scanned before execution, not after",
  "pair with adk-litellm to frame the gateway vs in-process choice",
]
